<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — RideMitra</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-auth="required">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">
    <aside class="side-nav" id="sideNav">
        <a href="index.html" class="brand"><span class="brand-mark">R</span> RideMitra</a>
        <a href="dashboard.html" class="side-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="find-ride.html" class="side-link"><i class="fa-solid fa-magnifying-glass"></i> Find a ride</a>
        <a href="offer-ride.html" class="side-link"><i class="fa-solid fa-square-plus"></i> Offer a ride</a>
        <a href="notifications.html" class="side-link"><i class="fa-regular fa-bell"></i> Notifications</a>
        <a href="account.html" class="side-link"><i class="fa-solid fa-user"></i> Account</a>
        <a href="settings.html" class="side-link"><i class="fa-solid fa-gear"></i> Settings</a>
        <div class="side-foot">
            <button class="side-link" data-logout style="width:100%;background:none;border:none;cursor:pointer;text-align:left;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
            </button>
        </div>
    </aside>

    <main class="app-main">
        <div class="app-topbar">
            <div style="display:flex;align-items:center;gap:14px;">
                <button class="mobile-menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <span class="eyebrow" style="margin:0;">Welcome back</span>
                    <h2 style="margin:0;" data-user-name>Rider</h2>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:14px;">
                <div class="notif-wrap">
                    <button class="notif-btn" id="notifBtn" aria-label="Notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notif-badge" data-notification-count>0</span>
                    </button>
                    <div class="notif-panel" id="notificationPanel">
                        <h3 style="font-size:1rem;margin-bottom:12px;">Notifications</h3>
                        <div id="notificationList"></div>
                    </div>
                </div>
                <div class="avatar-chip">
                    <div class="avatar-circle" data-user-initial>R</div>
                </div>
            </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <div>
                <span class="eyebrow" style="margin:0;">Driver actions</span>
                <h3 style="margin:0;">Booking requests</h3>
            </div>
            <span class="pill" id="bookingRequestCount">0 pending</span>
        </div>
        <div id="bookingRequests"></div>

        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-value" data-stat="published-rides">0</div>
                <div class="stat-label">Rides published</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" data-stat="booked-rides">0</div>
                <div class="stat-label">Rides booked</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" data-stat="earnings">₹0</div>
                <div class="stat-label">Earned from bookings</div>
            </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <h3 style="margin:0;">Your published rides</h3>
            <a href="offer-ride.html" class="btn btn-primary">Publish a ride</a>
        </div>
        <div id="myRecentRides"></div>

    </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
